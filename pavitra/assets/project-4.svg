<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <defs>
    <!-- Logo: a puzzle piece (browser extension) with a course path cut through it as negative space -->
    <mask id="pathCut" maskUnits="userSpaceOnUse" x="0" y="0" width="140" height="140">
      <rect x="0" y="18" width="112" height="112" rx="16" fill="#fff"/>
      <circle cx="56" cy="18" r="18" fill="#fff"/>
      <circle cx="112" cy="74" r="18" fill="#fff"/>
      <polyline points="30,104 30,78 82,78 82,48" fill="none" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="30" cy="104" r="11" fill="#000"/>
      <circle cx="82" cy="46" r="13" fill="#000"/>
      <circle cx="82" cy="46" r="5" fill="#fff"/>
    </mask>
  </defs>
  <rect width="1100" height="800" rx="30" fill="#f8e6da"/>
