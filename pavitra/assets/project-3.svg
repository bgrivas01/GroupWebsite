<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
  <!-- Colors and type follow RefIt's static/app.css: paper #efeee9, text #292b26, accent #576344, Georgia serif -->
  <rect width="1100" height="800" rx="30" fill="#efeee9"/>

  <!-- G-pen nib: one solid ink shape; slit, breather hole and shoulder are negative space.
       Sized to the wordmark's cap height, tip resting on the baseline. -->
  <defs>
    <mask id="nibCuts" maskUnits="userSpaceOnUse" x="-60" y="-90" width="120" height="190">
      <path d="M-30 -66 L30 -66 L30 -10 C30 24 10 52 0 86 C-10 52 -30 24 -30 -10 Z" fill="#fff"/>
      <path d="M-34 -40 Q0 -30 34 -40" fill="none" stroke="#000" stroke-width="6"/>
      <circle cx="0" cy="4" r="9" fill="#000"/>
      <path d="M0 10 L0 90" stroke="#000" stroke-width="5"/>
    </mask>
  </defs>
  <g transform="translate(120 200) rotate(35) scale(.75)">
    <rect x="-40" y="-80" width="80" height="180" fill="#292b26" mask="url(#nibCuts)"/>
  </g>

  <text x="206" y="252" font-family="Georgia,'Times New Roman',serif" font-size="150" letter-spacing="-7" fill="#292b26">RefIt<tspan fill="#576344">.</tspan></text>

  <!-- A quiet glimpse of the collection grid -->
  <g>
    <rect x="68" y="372" width="190" height="150" rx="6" fill="#c9d0b8"/>
    <circle cx="200" cy="420" r="22" fill="#f3efe2"/>
    <path d="M68 480 C120 455 170 470 258 450 L258 522 L68 522Z" fill="#8f9a78"/>
    <rect x="68" y="538" width="110" height="10" rx="5" fill="#292b26" opacity=".7"/>
    <rect x="68" y="558" width="76" height="8" rx="4" fill="#73746b" opacity=".55"/>
    <rect x="68" y="596" width="190" height="130" rx="6" fill="#e2ddd0"/>
    <path d="M110 690 C130 640 180 640 210 670" fill="none" stroke="#73746b" stroke-width="4" stroke-linecap="round" opacity=".6"/>

    <rect x="282" y="372" width="190" height="236" rx="6" fill="#4a4237"/>
    <ellipse cx="377" cy="470" rx="46" ry="58" fill="#a07f5f"/>
    <path d="M300 608 C320 540 434 540 454 608Z" fill="#6b5a47"/>
    <rect x="282" y="624" width="96" height="10" rx="5" fill="#292b26" opacity=".7"/>
    <rect x="282" y="644" width="130" height="8" rx="4" fill="#73746b" opacity=".55"/>

    <rect x="496" y="372" width="190" height="140" rx="6" fill="#d9c49a"/>
    <path d="M496 470 L560 430 L610 458 L686 412 L686 512 L496 512Z" fill="#b59a68"/>
