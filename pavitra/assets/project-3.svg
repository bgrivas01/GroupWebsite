    <rect x="496" y="586" width="190" height="180" rx="6" fill="#a9b4c2"/>
    <g fill="#e9eddf" opacity=".75"><ellipse cx="545" cy="630" rx="20" ry="7"/><ellipse cx="630" cy="660" rx="26" ry="8"/><ellipse cx="560" cy="710" rx="24" ry="7"/></g>

    <rect x="710" y="372" width="190" height="196" rx="6" fill="#c9a48f"/>
    <rect x="732" y="396" width="146" height="148" rx="3" fill="none" stroke="#efeee9" stroke-width="4" opacity=".7"/>
