<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Favorite Word</title>
    <script>
        function start() {
            var word = "Husky";
            var result = "";

            result += "<p>My favorite word is " + word + "</p>";
            result += "<p>Using Javascript, it is changed to</p>";
            result += "<p>" + word.toUpperCase() + "</p>";

            document.getElementById("results").innerHTML = result;
        }

        window.addEventListener("load", start, false);
    </script>
</head>
<body>
    <div id="results"></div>
</body>
</html>
